name: PR Breach Validation

# Lightweight validation specifically for breach event changes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/systems/events/**'
      - 'scripts/resources/BreachEventConfig.gd'
      - 'data/balance/breach_event_config.tres'
      - 'tests/test_breach_events_focused.*'

jobs:
  breach-validation:
    runs-on: ubuntu-latest
    name: 🎯 Breach System Validation

    steps:
    - name: Checkout PR
      uses: actions/checkout@v4

    - name: Setup Godot
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
        unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
        chmod +x Godot_v4.4.1-stable_linux.x86_64

    - name: Run breach tests
      id: breach-test
      run: |
        echo "🔬 Testing breach event system..."

        # Capture test output
        if ./Godot_v4.4.1-stable_linux.x86_64 --headless tests/test_breach_events_focused.tscn > test_output.log 2>&1; then
          echo "✅ Breach tests passed!"
          echo "breach_status=success" >> $GITHUB_OUTPUT
        else
          echo "❌ Breach tests failed!"
          echo "breach_status=failure" >> $GITHUB_OUTPUT
          cat test_output.log
          exit 1
        fi

    - name: Comment on PR
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const testStatus = '${{ steps.breach-test.outputs.breach_status }}';
          const emoji = testStatus === 'success' ? '✅' : '❌';
          const status = testStatus === 'success' ? 'PASSED' : 'FAILED';

          const comment = `## ${emoji} Breach Event System Validation ${status}

          **Test Results:**
          - 🎯 Breach Lifecycle: ${testStatus === 'success' ? 'PASS' : 'FAIL'}
          - 🔄 Ring Determinism: ${testStatus === 'success' ? 'PASS' : 'FAIL'}
          - ⚙️ Configuration Loading: ${testStatus === 'success' ? 'PASS' : 'FAIL'}
          - 🎭 Multi-Breach Independence: ${testStatus === 'success' ? 'PASS' : 'FAIL'}

          ${testStatus === 'success'
            ? '✅ **All breach event mechanics validated!** Safe to merge.'
            : '❌ **Breach tests failed.** Please review the test output and fix issues before merging.'}

          <details>
          <summary>Test Command</summary>

          \`\`\`bash
          ./Godot_v4.4.1-stable_linux.x86_64 --headless tests/test_breach_events_focused.tscn
          \`\`\`
          </details>`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });